services:
  service:
    image: "${APP_IMAGE:-amanda-blog-runtime}:${RUNTIME_IMAGE_TAG:-php8.4-local}"
    build:
      context: ../.
      dockerfile: Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.4-fpm-bookworm@sha256:c5fb7a0c02f4efe280691910c8b734995fa83598cdcf3115ef5dcb2e4617681c}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2@sha256:4d71c3c2109c61d5415544264b59ad4087e4c5b7244481723664138fd36d5040}
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      TZ: Asia/Taipei
    volumes:
      - ../../.:/var/www/html:delegated
      - ../php/local.ini:/usr/local/etc/php/conf.d/99-local.ini:ro
      - ../php/docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/20-xdebug.ini:ro
      - composer-cache:/tmp/composer-cache
    working_dir: /var/www/html
    networks:
      - web-network

  nginx:
    image: nginx:alpine
    container_name: ${NGINX_NAME}
    ports:
      - "${APP_PORT:-8091}:80"
    volumes:
      - ../../.:/var/www/html:ro
      - ../nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - service
    networks:
      - web-network

  scheduler:
    image: "${APP_IMAGE:-amanda-blog-runtime}:${RUNTIME_IMAGE_TAG:-php8.4-local}"
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
    volumes:
      - ../../.:/var/www/html:delegated
      - ../php/local.ini:/usr/local/etc/php/conf.d/99-local.ini:ro
      - composer-cache:/tmp/composer-cache
    working_dir: /var/www/html
    networks:
      - web-network

  queue:
    image: "${APP_IMAGE:-amanda-blog-runtime}:${RUNTIME_IMAGE_TAG:-php8.4-local}"
    command: ["php", "artisan", "queue:work", "database", "--sleep=1", "--tries=2", "--timeout=55", "--max-time=3600"]
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
    volumes:
      - ../../.:/var/www/html:delegated
      - ../php/local.ini:/usr/local/etc/php/conf.d/99-local.ini:ro
      - composer-cache:/tmp/composer-cache
    working_dir: /var/www/html
    networks:
      - web-network

networks:
  web-network:
    name: ${NETWORK_NAME}
    external: true

volumes:
  composer-cache:
    name: ${COMPOSER_CACHE_VOLUME:-amanda-blog-composer-cache}
    external: true
